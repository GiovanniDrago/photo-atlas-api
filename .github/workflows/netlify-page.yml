name: Netlify page

on:
  push:
    branches: [main]
    paths:
      - 'netlify/**'
      - 'scripts/build-netlify-page.sh'
      - '.github/workflows/netlify-page.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The artifact contains index.html and _redirects at its root, so the
      # downloaded zip can be dragged straight into Netlify Drop.
      - uses: actions/upload-artifact@v4
        with:
          name: photo-atlas-confirm-email
          path: netlify/email-confirm/
          if-no-files-found: error

      - name: Also build the standalone zip (for manual uploads)
        run: bash scripts/build-netlify-page.sh

      - uses: actions/upload-artifact@v4
        with:
          name: photo-atlas-confirm-email-zip
          path: dist/photo-atlas-confirm-email.zip
          if-no-files-found: error
